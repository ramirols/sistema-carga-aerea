<header class="sticky top-0 z-20 flex h-20 items-center
         border-b border-slate-200 bg-white/95 px-5
         backdrop-blur lg:px-8
         dark:border-slate-800 dark:bg-slate-900/95">
    <button type="button" class="mr-4 flex h-10 w-10 items-center
           justify-center rounded-xl text-slate-600
           hover:bg-slate-100 lg:hidden
           dark:text-slate-300 dark:hover:bg-slate-800" aria-label="Abrir menú" (click)="abrirMenu.emit()">
        <i class="pi pi-bars"></i>
    </button>

    <img src="/images/logo.png" alt="Logo Carga Aérea" class="h-10 w-auto shrink-0 object-contain" />

    <div class="ml-auto flex items-center gap-2 sm:gap-3">
        <button type="button" class="flex h-10 w-10 items-center
             justify-center rounded-xl text-slate-500
             transition hover:bg-slate-100
             dark:text-slate-300 dark:hover:bg-slate-800"
             aria-label="Cambiar tema" title="Cambiar tema claro/oscuro"
             (click)="themeService.alternar()">
            <i class="pi" [class.pi-moon]="!themeService.oscuro()" [class.pi-sun]="themeService.oscuro()"></i>
        </button>

        <button type="button" class="flex flex-col items-center gap-1
             rounded-xl px-1.5 py-1 transition
             hover:bg-slate-100 dark:hover:bg-slate-800"
             aria-label="Cuenta" (click)="panelUsuario.toggle($event)">
            <div class="flex h-10 w-10 items-center
                 justify-center rounded-full bg-blue-100
                 font-bold text-blue-700
                 dark:bg-blue-500/20 dark:text-blue-300">
                {{
                authService
                .usuario()
                ?.nombreCompleto
                ?.charAt(0)
                }}
            </div>

            <span class="hidden text-xs font-semibold
                 leading-none text-slate-800
                 dark:text-slate-100 sm:block">
                {{ authService.usuario()?.username }}
            </span>
        </button>
    </div>

    <p-popover #panelUsuario>
        <div class="w-72 py-1">
            <div class="flex flex-col items-center gap-2 px-3 pb-3 text-center">
                <div class="flex h-12 w-12 shrink-0 items-center
                     justify-center rounded-full bg-blue-100
                     font-bold text-blue-700
                     dark:bg-blue-500/20 dark:text-blue-300">
                    {{
                    authService
                    .usuario()
                    ?.nombreCompleto
                    ?.charAt(0)
                    }}
                </div>

                <div class="min-w-0">
                    <p class="text-sm font-semibold leading-snug
                         text-slate-800 dark:text-slate-100">
                        {{ authService.usuario()?.nombreCompleto }}
                    </p>

                    <p class="truncate text-xs text-slate-500 dark:text-slate-400">
                        {{ authService.usuario()?.username }}
                    </p>
                </div>
            </div>

            <div class="border-t border-slate-100 dark:border-slate-700"></div>

            <button type="button" class="flex w-full items-center gap-2
                 px-3 py-2.5 text-sm font-medium text-red-600
                 transition hover:bg-red-50
                 dark:hover:bg-red-500/10"
                 (click)="salir(); panelUsuario.hide()">
                <i class="pi pi-sign-out"></i>
                Cerrar sesión
            </button>
        </div>
    </p-popover>
</header>
