<header class="fixed inset-x-0 top-0 z-50
         border-b transition-all duration-300" [class.border-transparent]="!tieneScroll()"
    [class.bg-transparent]="!tieneScroll()" [class.border-slate-200]="tieneScroll()" [class.bg-white/90]="tieneScroll()"
    [class.shadow-sm]="tieneScroll()" [class.backdrop-blur-xl]="tieneScroll()"
    [class.dark:border-slate-800]="tieneScroll()" [class.dark:bg-slate-950/90]="tieneScroll()">
    <div class="mx-auto flex h-20 max-w-7xl
           items-center px-5 sm:px-6 lg:px-8">
        <!-- Logo -->
        <a href="#inicio" class="flex items-center gap-3" aria-label="Ir al inicio" (click)="cerrarMenu()">
            <img src="/images/logo.png" alt="Logo Carga Aérea" class="h-10 w-10 object-contain" />

            <div>
                <p class="text-sm font-bold leading-tight
                 text-slate-950 dark:text-white">
                    Carga Aérea
                </p>

                <p class="text-[11px] text-slate-500 dark:text-slate-400">
                    Gestión logística
                </p>
            </div>
        </a>

        <!-- Navegación de escritorio -->
        <nav class="mx-auto hidden items-center gap-1 lg:flex">
            <a href="#inicio" class="rounded-lg px-3 py-2 text-sm font-medium
               text-slate-600 transition
               hover:bg-slate-100 hover:text-[#0399D1]
               dark:text-slate-300 dark:hover:bg-slate-900
               dark:hover:text-[#05BBFB]">
                Inicio
            </a>

            <a href="#servicios" class="rounded-lg px-3 py-2 text-sm font-medium
               text-slate-600 transition
               hover:bg-slate-100 hover:text-[#0399D1]
               dark:text-slate-300 dark:hover:bg-slate-900
               dark:hover:text-[#05BBFB]">
                Servicios
            </a>

            <a href="#proceso" class="rounded-lg px-3 py-2 text-sm font-medium
               text-slate-600 transition
               hover:bg-slate-100 hover:text-[#0399D1]
               dark:text-slate-300 dark:hover:bg-slate-900
               dark:hover:text-[#05BBFB]">
                Proceso
            </a>

            <a href="#beneficios" class="rounded-lg px-3 py-2 text-sm font-medium
               text-slate-600 transition
               hover:bg-slate-100 hover:text-[#0399D1]
               dark:text-slate-300 dark:hover:bg-slate-900
               dark:hover:text-[#05BBFB]">
                Beneficios
            </a>

            <a href="#nosotros" class="rounded-lg px-3 py-2 text-sm font-medium
               text-slate-600 transition
               hover:bg-slate-100 hover:text-[#0399D1]
               dark:text-slate-300 dark:hover:bg-slate-900
               dark:hover:text-[#05BBFB]">
                Nosotros
            </a>

            <a href="#contacto" class="rounded-lg px-3 py-2 text-sm font-medium
               text-slate-600 transition
               hover:bg-slate-100 hover:text-[#0399D1]
               dark:text-slate-300 dark:hover:bg-slate-900
               dark:hover:text-[#05BBFB]">
                Contacto
            </a>
        </nav>

        <!-- Acciones -->
        <div class="ml-auto flex items-center gap-2">
            <button type="button" class="flex h-10 w-10 items-center justify-center
               rounded-xl text-slate-600 transition
               hover:bg-slate-100
               dark:text-slate-300 dark:hover:bg-slate-900" aria-label="Cambiar tema" (click)="alternarTema()">
                <i class="pi" [class.pi-moon]="!themeService.oscuro()" [class.pi-sun]="themeService.oscuro()"></i>
            </button>

            <a routerLink="/login" class="hidden items-center gap-2 rounded-xl
               bg-[#05BBFB] px-5 py-2.5
               text-sm font-bold text-slate-950
               shadow-lg shadow-[#05BBFB]/20
               transition duration-200
               hover:-translate-y-0.5 hover:bg-[#20c4fc]
               sm:flex">
                <i class="pi pi-sign-in"></i>
                Iniciar sesión
            </a>

            <button type="button" class="flex h-10 w-10 items-center justify-center
               rounded-xl text-slate-700 transition
               hover:bg-slate-100 lg:hidden
               dark:text-slate-200 dark:hover:bg-slate-900" aria-label="Abrir menú"
                [attr.aria-expanded]="menuAbierto()" (click)="alternarMenu()">
                <i class="pi" [class.pi-bars]="!menuAbierto()" [class.pi-times]="menuAbierto()"></i>
            </button>
        </div>
    </div>

    <!-- Menú móvil -->
    @if (menuAbierto()) {
    <div class="border-t border-slate-200
             bg-white/95 px-5 py-4 shadow-xl
             backdrop-blur-xl lg:hidden
             dark:border-slate-800 dark:bg-slate-950/95">
        <nav class="mx-auto flex max-w-7xl flex-col gap-1">
            <a href="#inicio" class="rounded-xl px-4 py-3 text-sm font-medium
                 text-slate-700 hover:bg-slate-100
                 dark:text-slate-300 dark:hover:bg-slate-900" (click)="cerrarMenu()">
                Inicio
            </a>

            <a href="#servicios" class="rounded-xl px-4 py-3 text-sm font-medium
                 text-slate-700 hover:bg-slate-100
                 dark:text-slate-300 dark:hover:bg-slate-900" (click)="cerrarMenu()">
                Servicios
            </a>

            <a href="#proceso" class="rounded-xl px-4 py-3 text-sm font-medium
                 text-slate-700 hover:bg-slate-100
                 dark:text-slate-300 dark:hover:bg-slate-900" (click)="cerrarMenu()">
                Proceso
            </a>

            <a href="#beneficios" class="rounded-xl px-4 py-3 text-sm font-medium
                 text-slate-700 hover:bg-slate-100
                 dark:text-slate-300 dark:hover:bg-slate-900" (click)="cerrarMenu()">
                Beneficios
            </a>

            <a href="#nosotros" class="rounded-xl px-4 py-3 text-sm font-medium
                 text-slate-700 hover:bg-slate-100
                 dark:text-slate-300 dark:hover:bg-slate-900" (click)="cerrarMenu()">
                Nosotros
            </a>

            <a href="#contacto" class="rounded-xl px-4 py-3 text-sm font-medium
                 text-slate-700 hover:bg-slate-100
                 dark:text-slate-300 dark:hover:bg-slate-900" (click)="cerrarMenu()">
                Contacto
            </a>

            <a routerLink="/login" class="mt-3 flex items-center justify-center gap-2
                 rounded-xl bg-[#05BBFB] px-4 py-3
                 text-sm font-bold text-slate-950" (click)="cerrarMenu()">
                <i class="pi pi-sign-in"></i>
                Iniciar sesión
            </a>
        </nav>
    </div>
    }
</header>
