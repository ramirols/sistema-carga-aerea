# ==================================================
# CONFIGURACION GENERAL
# ==================================================

spring.application.name=backend
server.port=8080


# ==================================================
# CONEXION A MYSQL
# ==================================================

spring.datasource.url=jdbc:mysql://localhost:3306/carga_aerea_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==================================================
# JPA E HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Guarda el estado completo del registro al eliminarlo, para que el
# historial de auditoria muestre los datos y no solo el id.
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# ==================================================
# CONFIGURACION JSON
# ==================================================

spring.jackson.time-zone=America/Lima


# ==================================================
# MENSAJES DE ERROR Y VALIDACION
# ==================================================

server.error.include-message=always
server.error.include-binding-errors=always


# ==================================================
# CONFIGURACION JWT
# ==================================================

app.jwt.secret=SistemaCargaAereaJwtClaveSegura2026Cibertec
app.jwt.expiration-minutes=60


# ==================================================
# CONFIGURACION CORS
# ==================================================

app.cors.allowed-origin=http://localhost:4200


# ==================================================
# CLOUDINARY (almacenamiento de la carta poder)
# ==================================================
# Credenciales retiradas tras la sustentacion. Genera una cuenta/credenciales
# nuevas en cloudinary.com y coloca aqui tu propio cloud-name, api-key y
# api-secret antes de volver a usar la subida de carta poder.

cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# ==================================================
# ABANDONO DE ENCOMIENDAS NO RECLAMADAS
# ==================================================

carga.almacenaje.dias-limite-abandono=30
